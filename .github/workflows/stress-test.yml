name: Stress test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-version:
    uses: $/.github/workflows/python-version.yml
  test:
    # This action doesn't work on PRs from forks because the secret SSH key is not available
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    needs: python-version
    runs-on: ubuntu-latest
    env:
      # Configures where PolyglotDB is installed, also read by `pgdb.py`
      PGDB_HOME: ${{ github.workspace }}/pgdb_home
      # Stress test scripts read this
      TEST_REPO_ROOT: ${{ github.workspace }}/testing
    timeout-minutes: 120
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
      - name: Checkout testing repository
        uses: actions/checkout@v7
        with:
          repository: MontrealCorpusTools/polyglotdb-testing
          ssh-key: ${{ secrets.PRIVATE_SSH_KEY }}
          path: testing
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python-version.outputs.min }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin # This specifies the JDK distribution. Temurin is a popular choice.
          java-version: "21"
      - name: Download and set up Praat
        run: |
          wget -q https://github.com/praat/praat/releases/download/v6.4.21/praat6421_linux-intel64-barren.tar.gz -O praat.tar.gz
          tar -xzf praat.tar.gz
          echo "praat_path=$(pwd)/praat_barren" >> $GITHUB_ENV
      - name: Install packages
        # pyyaml and pandas are dependencies from the stress test repo
        run: |
          pip install -e .
          pip install pyyaml pandas
      - name: Install and start databases
        run: |
          pgdb install "$PGDB_HOME"
          pgdb start
      - name: Run duration.py
        working-directory: testing
        run: |
          python duration.py -r ice-can
          python check_duration.py
      - name: Run sibilant.py
        working-directory: testing
        run: |
          python sibilant.py -r ice-can
          python check_sibilants.py
      - name: Run formant.py
        working-directory: testing
        run: |
          python formant.py -r ice-can
          python check_formants.py
      - name: Run formant_track.py
        working-directory: testing
        run: |
          python formant_track.py -r ice-can
          python check_formant_tracks.py
