name: Build and publish to PyPI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-version:
    uses: $/.github/workflows/python-version.yml
  build:
    needs: python-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Always fetch entire history for setuptools-scm to work properly
          # https://setuptools-scm.readthedocs.io/latest/integrations/#troubleshooting
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python-version.outputs.min }}
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist, then wheel from sdist
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
