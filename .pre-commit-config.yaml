repos:
  - repo: local
    hooks:
      - id: profile-check
        name: no profiling
        entry: '@profile'
        language: pygrep
        types: [ python ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/asottile/setup-cfg-fmt
    rev: v2.2.0
    hooks:
      - id: setup-cfg-fmt
        args:
          - --min-py3-version
          - "3.8"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: trailing-whitespace
        exclude: .txt$
      - id: end-of-file-fixer
        exclude: .txt$
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: mixed-line-ending
